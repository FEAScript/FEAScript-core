<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FEAScript UMD test</title>
    <!--
      Test of the UMD bundle loaded with a classic <script> tag (no import map, no type="module").
      Automatically in headless Chromium and Firefox: npm run test:browser (see README.md).
      By hand: npm run build, serve the FEAScript-core folder and open this page, e.g.
        npx http-server . -p 8080   ->   http://localhost:8080/tests/umd/umd.test.html
      The page lives in a different folder from dist/ on purpose: FEAScriptWorker must find
      feascript-worker.esm.js next to feascript.umd.js, not next to this page.
    -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 16px;
        background: #fff;
        color: #111;
      }
      li.pass {
        color: #137333;
      }
      li.fail {
        color: #b3261e;
      }
      .plot {
        width: 100%;
        max-width: 640px;
        height: 360px;
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"></script>
    <script src="../../dist/feascript.umd.js"></script>
  </head>
  <body>
    <h1>FEAScript UMD test</h1>
    <ul id="results"></ul>
    <div id="mainThreadPlot" class="plot"></div>
    <div id="workerPlot" class="plot"></div>

    <script>
      const results = document.getElementById("results");
      function report(name, ok, detail) {
        const li = document.createElement("li");
        li.className = ok ? "pass" : "fail";
        li.textContent = `${ok ? "PASS" : "FAIL"}: ${name}${detail ? ` (${detail})` : ""}`;
        results.appendChild(li);
        console[ok ? "log" : "error"](li.textContent);
      }

      // Same 1D wall as examples/heatConductionScript/heatConduction1DWall: convection on the left, 5 °C on the right
      const geometry = { line: 0.15 };
      const mesh = { elementOrder: "linear", divisions: 10 };
      const conditions = [
        ["left", ["convection", 1, 25]],
        ["right", ["constantTemperature", 5]],
      ];
      const expectedRight = 5;

      async function run() {
        // 1. The bundle defines a FEAScript global
        const hasGlobal = typeof FEAScript === "object" && typeof FEAScript.FEAScriptModel === "function";
        report(
          "window.FEAScript is defined",
          hasGlobal,
          hasGlobal ? `version ${FEAScript.printVersion}` : "",
        );
        if (!hasGlobal) return;
        const { FEAScriptModel, FEAScriptWorker, plotSolution } = FEAScript;

        // 2. Solve on the main thread and plot with the Plotly global
        let mainSolution;
        try {
          const model = new FEAScriptModel();
          model.setModelConfig("heatConductionScript");
          model.setGeometry(geometry);
          model.setMeshConfig(mesh);
          for (const [boundary, condition] of conditions) model.addBoundaryCondition(boundary, condition);
          model.setSolverMethod("lusolve");
          const result = model.solve();
          mainSolution = Array.from(result.solutionVector);
          const right = mainSolution[mainSolution.length - 1];
          report("Main-thread solve", Math.abs(right - expectedRight) < 1e-9, `T(right) = ${right}`);
          plotSolution(model, result, "line", "mainThreadPlot");
          report("Plotly plot", document.querySelector("#mainThreadPlot .plot-container") !== null);
        } catch (error) {
          report("Main-thread solve", false, error.message);
        }

        // 3. Solve in the worker: checks that feascript-worker.esm.js is found next to the bundle
        try {
          const worker = new FEAScriptWorker();
          await worker.ping();
          await worker.setModelConfig("heatConductionScript");
          await worker.setGeometry(geometry);
          await worker.setMeshConfig(mesh);
          for (const [boundary, condition] of conditions)
            await worker.addBoundaryCondition(boundary, condition);
          await worker.setSolverMethod("lusolve");
          const result = await worker.solve();
          const workerSolution = Array.from(result.solutionVector);
          const maxDiff = mainSolution
            ? Math.max(...workerSolution.map((value, i) => Math.abs(value - mainSolution[i])))
            : NaN;
          report("Worker solve matches main thread", maxDiff < 1e-12, `max difference ${maxDiff}`);
          plotSolution(await worker.getModelInfo(), result, "line", "workerPlot");
          worker.terminate();
        } catch (error) {
          report("Worker solve", false, error.message);
        }

        // 4. Solve with "jacobi-gpu": checks that the WebGPU worker is found in src/workers/ beside dist/.
        // Plain Jacobi converges slowly on the wall above (the convection node is weakly coupled), so this uses
        // 4 elements with both temperatures fixed. Taichi.js works in 32-bit floats: the residual cannot go much
        // below 1e-4 here, hence the tolerance and the looser match with LU
        if (!navigator.gpu || !(await navigator.gpu.requestAdapter().catch(() => null))) {
          report("WebGPU solve", true, "SKIP: no WebGPU adapter in this browser");
        } else {
          try {
            const createModel = (solverMethod) => {
              const model = new FEAScriptModel();
              model.setModelConfig("heatConductionScript");
              model.setGeometry(geometry);
              model.setMeshConfig({ ...mesh, divisions: 4 });
              model.addBoundaryCondition("left", ["constantTemperature", 25]);
              model.addBoundaryCondition("right", ["constantTemperature", 5]);
              model.setSolverMethod(solverMethod);
              return model;
            };
            const reference = Array.from(createModel("lusolve").solve().solutionVector);
            const result = await createModel("jacobi-gpu").solveAsync(null, {
              maxIterations: 500,
              tolerance: 1e-3,
            });
            const gpuSolution = Array.from(result.solutionVector);
            const maxDiff = Math.max(...gpuSolution.map((value, i) => Math.abs(value - reference[i])));
            report("WebGPU solve matches LU", maxDiff < 1e-3, `max difference ${maxDiff}`);
          } catch (error) {
            report("WebGPU solve", false, error.message);
          }
        }

        document.title = results.querySelector(".fail") ? "FAIL" : "PASS";
      }

      run();
    </script>
  </body>
</html>
